services:
  db:
    image: mysql:8.0
    container_name: taskapp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass          # root のパスワード
      MYSQL_DATABASE: taskdb                 # 起動時に自動作成されるDB
      MYSQL_USER: taskuser                   # アプリ用のユーザー
      MYSQL_PASSWORD: taskpass
      TZ: Asia/Tokyo
    ports:
      - "3306:3306"                          # PC側:コンテナ側
    volumes:
      - mysql-data:/var/lib/mysql            # ★データを永続化する
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

volumes:
  mysql-data: