<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>タスク管理</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>タスク管理</h1>

    <!-- 完了メッセージ -->
    <p class="message" th:if="${message}" th:text="${message}"></p>

    <!-- 絞り込み -->
    <div class="filters">
        <a th:href="@{/tasks}">すべて</a>
        <a th:href="@{/tasks(filter='todo')}">未完了</a>
        <a th:href="@{/tasks(filter='done')}">完了</a>
    </div>

    <!-- 一覧 -->
    <p th:if="${#lists.isEmpty(tasks)}">該当するタスクはありません。</p>

    <table th:unless="${#lists.isEmpty(tasks)}">
        <thead>
        <tr>
            <th>状態</th>
            <th>タイトル</th>
            <th>期限</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="task : ${tasks}" th:classappend="${task.done} ? 'done' : ''">
            <td th:text="${task.done} ? '完了' : '未完了'">未完了</td>
            <td th:text="${task.title}">サンプルタスク</td>
            <td th:text="${task.dueDate != null} ? ${#temporals.format(task.dueDate, 'yyyy/MM/dd')} : '-'">2026/08/01</td>
            <td>
                <form th:action="@{/tasks/{id}/toggle(id=${task.id})}" method="post" class="inline">
                    <button type="submit" th:text="${task.done} ? '未完了に戻す' : '完了にする'">完了にする</button>
                </form>
                <form th:action="@{/tasks/{id}/delete(id=${task.id})}" method="post" class="inline"
                      onsubmit="return confirm('削除してよろしいですか？');">
                    <button type="submit" class="danger">削除</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- 登録フォーム -->
    <h2>新規登録</h2>
    <form th:action="@{/tasks}" th:object="${taskForm}" method="post">
        <div class="field">
            <label for="title">タイトル</label>
            <input type="text" id="title" th:field="*{title}" placeholder="例：設計書をレビューする">
            <span class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
        </div>

        <div class="field">
            <label for="dueDate">期限</label>
            <input type="date" id="dueDate" th:field="*{dueDate}">
            <span class="error" th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}"></span>
        </div>

        <button type="submit">登録する</button>
    </form>
</div>
</body>
</html>
