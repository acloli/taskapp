<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>タスク編集</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>タスク編集</h1>

    <!-- 登録フォーム -->
    <h2>編集</h2>
    <form th:action="@{/tasks/{id}(id=${id})}" th:object="${taskForm}" method="post">
        <div class="field">
            <label for="title">タイトル</label>
            <input type="text" id="title" th:field="*{title}" placeholder="例：設計書をレビューする">
            <span class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
        </div>

        <div class="field">
            <label for="dueDate">期限</label>
            <input type="date" id="dueDate" th:field="*{dueDate}">
            <span class="error" th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}"></span>
        </div>

        <div class="field">
            <label for="category">カテゴリ</label>
            <select id="category" th:field="*{category}">
                <option value="">選択してください</option>
                <option value="WORK" th:selected="${taskForm.category == T(com.example.taskapp.model.TaskCategory).WORK}">仕事</option>
                <option value="PRIVATE" th:selected="${taskForm.category == T(com.example.taskapp.model.TaskCategory).PRIVATE}">私用</option>
                <option value="OTHER" th:selected="${taskForm.category == T(com.example.taskapp.model.TaskCategory).OTHER}">その他</option>
            </select>
            <span class="error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></span>
        </div>

        <button type="submit">登録する</button>
        <a th:href="@{/tasks}">一覧に戻る</a>
    </form>

    <!-- 完了メッセージ -->
    <p class="message" th:if="${message}" th:text="${message}"></p>

    
</div>
</body>
</html>
