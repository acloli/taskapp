spring.application.name=taskapp
# テンプレートのキャッシュを無効化（変更が即座に反映される）
spring.thymeleaf.cache=false


# ===== データベース接続設定 =====
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/taskdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8
spring.datasource.username=taskuser
spring.datasource.password=taskpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA設定 =====
# エンティティに合わせてテーブルを自動作成・更新する（開発用）
spring.jpa.hibernate.ddl-auto=update
# 実行されるSQLをコンソールに表示する（学習に有用）
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ドキュメントのURL変更
springdoc.swagger-ui.path=/swagger-ui.html
# タグ名でソート
springdoc.swagger-ui.tagsSorter=alpha

# 本番環境では無効化する（重要）
# springdoc.api-docs.enabled=false
# springdoc.swagger-ui.enabled=false


# 全体は INFO 以上、自分のアプリだけ DEBUG 以上を出力
logging.level.root=INFO
logging.level.com.example.taskapp=DEBUG

# ファイルにも出力する
logging.file.name=logs/taskapp.log