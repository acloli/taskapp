spring.application.name=taskapp
# テンプレートのキャッシュを無効化（変更が即座に反映される）
spring.thymeleaf.cache=false


# ===== データベース接続設定 =====
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=true&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA設定 =====
# エンティティに合わせてテーブルを自動作成・更新する（開発用）
spring.jpa.hibernate.ddl-auto=validate
# 実行されるSQLをコンソールに表示する（学習に有用）
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ドキュメントのURL変更
springdoc.swagger-ui.path=/swagger-ui.html
# タグ名でソート
springdoc.swagger-ui.tagsSorter=alpha

# 本番環境では無効化する（重要）
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false


# 全体は INFO 以上、自分のアプリだけ WARN 以上を出力
logging.level.root=INFO
logging.level.com.example.taskapp=WARN

# ファイルにも出力する
logging.file.name=logs/taskapp.log